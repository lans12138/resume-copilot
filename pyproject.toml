[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-copilot"
version = "0.1.0"
description = "Enterprise recruiting Copilot modular monolith"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.16,<2.0",
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.116,<1.0",
  "pwdlib[argon2]>=0.3,<1.0",
  "pydantic-settings>=2.10,<3.0",
  "pymupdf>=1.28,<2.0",
  "pyjwt>=2.10,<3.0",
  "python-docx>=1.2,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "redis>=6.4,<8.0",
  "sqlalchemy[asyncio]>=2.0.43,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.12,<3.0",
  "mypy>=1.17,<2.0",
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
include = ["apps.api*", "apps.worker*", "apps.scheduler*", "backend*"]

[tool.pytest.ini_options]
addopts = "-ra"
filterwarnings = ["error"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps", "backend", "tests/unit"]
