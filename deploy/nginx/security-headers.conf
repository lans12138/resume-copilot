# Shared response headers for the public entry point.
#
# ``always`` is required on each directive: without it Nginx omits the header on
# error responses, which is exactly where a browser would otherwise be free to
# sniff a body it should not execute.
#
# X-Frame-Options / CSP frame-ancestors are set because the session token lives
# in sessionStorage: a cross-origin frame that could render the app could also
# read it back through the same-origin policy of its own document.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# No inline scripts or styles are used by the build (Vite emits external
# modules), so the CSP can stay strict. connect-src is limited to self because
# the SPA reaches the API through this same origin by design.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
