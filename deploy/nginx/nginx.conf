# Reverse proxy and static host for the browser client (FIN-012).
#
# Two constraints drive this file, and both are covered by
# tests/validate_nginx_proxy.ps1 rather than by reading it:
#
# 1. Server-sent events must reach the browser frame by frame. Nginx buffers
#    proxied responses by default, which turns a live stream into a burst that
#    arrives when the run ends. ``X-Accel-Buffering: no`` is already set by the
#    API (backend/app/sse/routes.py), but that header is only read when the
#    response is *generated*; ``proxy_buffering off`` is asserted here so the
#    behaviour does not depend on the upstream remembering to send it.
# 2. The API authenticates with a Bearer header, not a cookie. Nginx forwards
#    Authorization untouched as a hop-by-hop-agnostic request header; the probe
#    asserts that a token-holding stream succeeds through the proxy and that a
#    token-less one is still rejected by the API (401), i.e. Nginx is not
#    silently answering authorization itself.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Keep the access log on the default combined format; request ids are echoed
    # by the API in its own log, so pairing the two is a client-side join on the
    # X-Request-ID header rather than a custom log format here.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 75s;
    server_tokens off;

    # Resume uploads are bounded by MAX_FILE_SIZE_MB upstream, which owns the
    # user-facing error and the audit trail; the proxy limit is a wider backstop
    # so a rejected upload still produces the API's JSON error rather than an
    # Nginx 413 the client cannot interpret.
    client_max_body_size 64m;
    client_body_timeout 60s;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/plain;

    # ``real_ip`` is deliberately not configured: the deployment assumes the
    # proxy is the edge, and trusting a client-supplied X-Forwarded-For here
    # would let a caller forge the audit-relevant source address.

    include /etc/nginx/conf.d/*.conf;
}
